packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.4'
  - '@turbo/darwin-arm64@2.11.4'
  - '@turbo/linux-64@2.11.4'
  - '@turbo/linux-arm64@2.11.4'
  - '@turbo/windows-64@2.11.4'
  - '@turbo/windows-arm64@2.11.4'
  - turbo@2.11.4
  - '@vitest/mocker@5.0.2'
  - '@vitest/spy@5.0.2'
  - vitest@5.0.2

allowBuilds:
  # Nudge-only postinstall (prints a one-line setup hint, never fails the install — verified in the package source).
  '@astryxdesign/cli': true
  # Nudge-only postinstall (prints a one-line setup hint, always exits 0 — verified in the package source).
  '@astryxdesign/core': true
  '@swc/core': true
  core-js: false
  esbuild: true
